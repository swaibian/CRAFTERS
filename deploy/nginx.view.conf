# Nginx for the view container: static files + /api proxy to the controller.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hash routes (#/, #/settings) are client-side: always serve index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API goes to the controller service (same compose network).
    location /api/ {
        proxy_pass http://controller:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        # SSE streaming: no buffering, keep the connection open.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
